"$schema" = 'https://starship.rs/config-schema.json'

# 两行布局：系统、目录、Git 在左，时间在第一行右侧。
format = '$os$directory$git_branch$git_commit$git_state$git_status$fill$time$line_break$character'
palette = 'soft_pastel'
add_newline = true

# 柔和配色；所有模块沿用终端背景。
[palettes.soft_pastel]
blue = '#8aadf4'
pink = '#ed8796'
green = '#a6da95'
purple = '#c6a0f6'
clock = '#f5bde6'
yellow = '#eed49f'

[os]
disabled = false
format = '[$symbol]($style) '
style = 'bold green'

# Nerd Font 系统图标：根据当前操作系统自动选择。
[os.symbols]
Alpaquita = ''
Alpine = ''
AlmaLinux = ''
Amazon = ''
Android = ''
AOSC = ''
Arch = ''
Artix = ''
CachyOS = ''
CentOS = ''
Debian = ''
DragonFly = ''
Elementary = ''
Emscripten = ''
EndeavourOS = ''
Fedora = ''
FreeBSD = ''
Garuda = '󰛓'
Gentoo = ''
HardenedBSD = '󰞌'
Illumos = '󰈸'
Ios = '󰀷'
Kali = ''
Linux = ''
Mabox = ''
Macos = ''
Manjaro = ''
Mariner = ''
MidnightBSD = ''
Mint = ''
NetBSD = ''
NixOS = ''
Nobara = ''
OpenBSD = '󰈺'
openSUSE = ''
OracleLinux = '󰌷'
Pop = ''
Raspbian = ''
Redhat = ''
RedHatEnterprise = ''
RockyLinux = ''
Redox = '󰀘'
Solus = '󰠳'
SUSE = ''
Ubuntu = ''
Unknown = ''
Void = ''
Windows = '󰍲'
Zorin = ''

[directory]
format = '[ $path]($style)[$read_only]($read_only_style) '
style = 'bold blue'
read_only = ' 󰌾'
read_only_style = 'pink'
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = false
home_symbol = '~'
# 仓库根目录加下划线，保留蓝色；父路径使用普通字重。
before_repo_root_style = 'blue'
repo_root_style = 'bold underline blue'
repo_root_format = '[ ]($style)[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) '
# 使用 / 分割，并保留 cd 时使用的符号链接路径。
use_os_path_sep = false
use_logical_path = true

[git_branch]
symbol = ' '
format = '[$symbol$branch]($style) '
style = 'bold pink'
# detached HEAD 时由 git_commit 显示哈希，避免重复显示 HEAD。
only_attached = true

# detached HEAD 时显示提交短哈希。
[git_commit]
format = '[ $hash]($style) '
style = 'bold pink'
only_detached = true

[git_state]
format = '[\($state( $progress_current/$progress_total)\)]($style) '
style = 'bold purple'

# W = 工作区（未暂存）；S = 暂存区；干净时整组隐藏。
[git_status]
format = '([$conflicted]($style) )([W:$worktree_added$worktree_modified$worktree_deleted$worktree_typechanged]($style) )([S:$index_added$index_modified$index_deleted$renamed$index_typechanged]($style) )([$untracked]($style) )([$stashed]($style) )([$ahead_behind]($style) )'
style = 'bold yellow'
conflicted = '≠${count}'
ahead = '↑${count}'
behind = '↓${count}'
diverged = '↑${ahead_count}↓${behind_count}'
untracked = '?${count}'
stashed = '≡${count}'
# + 新增、! 修改、✘ 删除、» 重命名、~ 类型变化。
# worktree_added 对应 git add -N；普通新文件由 untracked 单独计数。
worktree_added = '+${count}'
worktree_modified = '!${count}'
worktree_deleted = '✘${count}'
worktree_typechanged = '~${count}'
index_added = '+${count}'
index_modified = '!${count}'
index_deleted = '✘${count}'
index_typechanged = '~${count}'
renamed = '»${count}'
# 使用上面的精细状态，避免旧汇总符号造成重复显示。
modified = ''
staged = ''
deleted = ''
typechanged = ''

[fill]
symbol = ' '

[time]
disabled = false
format = '[ $time]($style) '
style = 'bold clock'
time_format = '%H:%M'
# 使用 IANA 时区名，跨平台统一北京时间；跟随本机可改为 'local'。
utc_time_offset = 'Asia/Shanghai'

[line_break]
disabled = false

[character]
success_symbol = '[➜](bold green)'
error_symbol = '[➜](bold pink)'
vimcmd_symbol = '[❮](bold purple)'
